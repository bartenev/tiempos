<style>
/* Layout: one reading column like a workbook page — exercise card on top, the answer pad under it, the explanation unfolds below. */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --ink: #16212e;
  --muted: #5a6875;
  --line: #d6dde3;
  --accent: #2350a8;
  --accent-soft: #e2e9f6;
  --ok: #23774a;
  --ok-soft: #e1f1e8;
  --bad: #b2362b;
  --bad-soft: #f8e4e1;
  --warn: #8f5c00;
  --warn-soft: #f6ecd8;
  --f-display: "Alegreya", Georgia, "Times New Roman", serif;
  --f-ui: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151c; --surface: #17202a; --ink: #e5ebf0; --muted: #94a3b0; --line: #2a3643;
    --accent: #84a9f2; --accent-soft: #1d2a42; --ok: #6cc08e; --ok-soft: #173326; --bad: #f08b7f; --bad-soft: #3a1e1b;
    --warn: #e2b04f; --warn-soft: #362a12; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151c; --surface: #17202a; --ink: #e5ebf0; --muted: #94a3b0; --line: #2a3643;
  --accent: #84a9f2; --accent-soft: #1d2a42; --ok: #6cc08e; --ok-soft: #173326; --bad: #f08b7f; --bad-soft: #3a1e1b;
  --warn: #e2b04f; --warn-soft: #362a12; color-scheme: dark;
}
* { box-sizing: border-box; }
/* вкладки прячутся атрибутом hidden; без !important его перебивает .wrap { display: grid } */
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 17px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 780px; margin: 0 auto; display: grid; gap: 18px; }
header.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 10px 20px; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: 1.9rem; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h1 span { color: var(--accent); }
.sub { color: var(--muted); font-size: 0.95rem; margin: 2px 0 0; }
nav.tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); padding: 3px; }
nav.tabs button { border: 0; background: none; font: 500 0.95rem var(--f-ui); color: var(--muted); padding: 6px 16px; border-radius: 999px; cursor: pointer; }
nav.tabs button[aria-selected="true"] { background: var(--accent); color: var(--surface); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Filters */
.filters { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; font-size: 0.92rem; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; font: 500 0.9rem var(--f-ui); color: var(--ink); padding: 5px 11px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.filters label { display: inline-flex; gap: 6px; align-items: center; }
select { font: 500 0.92rem var(--f-ui); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; max-width: 100%; }

.progress { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 0.9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s; }

/* Exercise card */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px 22px; display: grid; gap: 12px; min-width: 0; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; font-size: 0.85rem; color: var(--muted); }
.meta code { font-family: var(--f-mono); font-size: 0.8rem; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }
.instr { font-style: italic; }
.ctx { font-size: 0.95rem; color: var(--muted); border-left: 3px solid var(--line); padding-left: 10px; }
.sentence { font-family: var(--f-display); font-size: 1.45rem; line-height: 1.55; overflow-wrap: anywhere; }
.slot { display: inline-block; min-width: 3.2em; text-align: center; border-bottom: 2px solid var(--accent); color: var(--accent); font-weight: 700; padding: 0 4px; margin: 0 2px; }
.slot.ok { color: var(--ok); border-color: var(--ok); background: var(--ok-soft); border-radius: 4px 4px 0 0; }
.slot.bad { color: var(--bad); border-color: var(--bad); background: var(--bad-soft); border-radius: 4px 4px 0 0; }

.pad { display: flex; flex-wrap: wrap; gap: 10px 14px; }
.pad .grp { display: flex; flex-wrap: wrap; gap: 6px; }
.pad button {
  font: 500 1.05rem var(--f-display); min-width: 3.1em; padding: 7px 12px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink);
}
.pad button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.pad button:disabled { cursor: default; opacity: .55; }
.pad button.pick-ok { opacity: 1; background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.pad button.pick-bad { opacity: 1; background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.pad button.right { opacity: 1; border-color: var(--ok); color: var(--ok); }

/* Explanation */
.explain { display: grid; gap: 12px; border-top: 1px dashed var(--line); padding-top: 14px; }
.verdict { font-weight: 700; font-size: 1.05rem; }
.verdict.ok { color: var(--ok); }
.verdict.bad { color: var(--bad); }
.verdict b { font-family: var(--f-display); }
ol.chain { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
ol.chain li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; position: relative; padding-bottom: 10px; }
ol.chain li::before { content: ""; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--accent); background: var(--surface); margin: 6px 0 0 4px; position: relative; z-index: 1; }
ol.chain li::after { content: ""; position: absolute; left: 10px; top: 16px; bottom: -2px; width: 2px; background: var(--line); }
ol.chain li:last-child::after { display: none; }
ol.chain li.main::before { background: var(--accent); }
.rule { min-width: 0; }
.rule .src { display: inline-block; font: 500 0.72rem var(--f-mono); letter-spacing: .02em; color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 1px 6px; margin-right: 6px; vertical-align: 1px; }
.note { font-size: 0.92rem; color: var(--muted); }
.flag { font-size: 0.9rem; border-radius: 8px; padding: 8px 12px; background: var(--warn-soft); color: var(--warn); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn { font: 700 0.95rem var(--f-ui); border-radius: 8px; padding: 8px 16px; cursor: pointer; border: 1px solid var(--accent); background: var(--accent); color: var(--surface); }
.btn.ghost { background: none; color: var(--accent); }
.kbd { font: 0.75rem var(--f-mono); color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; }

/* Scheme wizard */
.trail { display: grid; gap: 4px; font-size: 0.92rem; }
.trail button { text-align: left; border: 0; background: none; padding: 4px 0; cursor: pointer; color: var(--muted); font: inherit; display: grid; grid-template-columns: auto 1fr; gap: 8px; }
.trail button:hover { color: var(--accent); }
.trail .ans { color: var(--ink); font-weight: 500; }
.trail .n { font-family: var(--f-mono); font-size: 0.75rem; color: var(--accent); padding-top: 3px; }
.q { font-family: var(--f-display); font-size: 1.35rem; font-weight: 500; text-wrap: balance; margin: 0; }
.qhint { color: var(--muted); font-size: 0.92rem; margin: -4px 0 0; }
.opts { display: grid; gap: 8px; }
.opts button {
  text-align: left; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 9px;
  padding: 10px 14px; cursor: pointer; font: 500 1rem var(--f-ui); display: grid; gap: 2px;
}
.opts button:hover { border-color: var(--accent); }
.opts button em { font: italic 400 0.95rem var(--f-display); color: var(--muted); }
.result-kind { font-family: var(--f-display); font-size: 1.6rem; font-weight: 700; color: var(--accent); margin: 0; }
.form-grid { display: grid; gap: 10px; }
.form-row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; font-size: 0.95rem; }
.form-row > span:first-child { min-width: 7.5em; color: var(--muted); }
.form-out { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; padding: 12px 14px; background: var(--accent-soft); border-radius: 9px; }
.form-out b { font: 700 2rem var(--f-display); color: var(--accent); }
.form-out span { font-size: 0.92rem; color: var(--ink); }
footer { color: var(--muted); font-size: 0.85rem; }
.navlinks { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; font-size: 0.92rem; }
.navlinks a { color: var(--accent); text-decoration: none; font-weight: 500; }
.navlinks a:hover { text-decoration: underline; }
@media (max-width: 520px) {
  body { font-size: 16px; }
  .card { padding: 16px; }
  .sentence { font-size: 1.25rem; }
  h1 { font-size: 1.6rem; }
}
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

ервые → un","C.tipo":"GBE C / GDU5: не конкретный предмет — тип, средство, материал → Ø","C.cantidad":"GBE C / GDU5: неопределённое количество → Ø","C.num-pl":"GBE C: исчисляемое при Ø — во мн.ч.","C.num-sg":"GBE C: неисчисляемое при Ø — в ед.ч.","C.eval":"GDU5: …но оценочное определение → un (unos sellos muy raros, un pan buenísimo)","D.clase":"GBE D / GDU6-7: весь класс, в общем смысле → el","D.cualquiera":"GBE D / GDU4: любой представитель класса → un","D.sujeto":"GBE D: подлежащее-обобщение обязательно с артиклем (проверка)","A.forma":"GBE A / GDU4,6: форма по роду и числу","A.a-tonica":"GBE A / GDU4,6: el/un перед ж.р. ед.ч. на ударное a- (вплотную)","A.a-tonica-no":"GBE A / GDU4,6: ударное a-, но не вплотную / мн.ч. → женская форма","A.contraccion":"GBE A / GDU6: a + el = al, de + el = del","A.no-contraccion":"GBE A: артикль — часть имени собственного → не сливается (a El Cairo)","A.uno":"GBE E / GDU11: un → uno без существительного","E.indef-sin-sust":"GBE E / GDU11: una/unos/unas без существительного","E.def-sin-sust":"GBE E / GDU11: el/la/los/las без сущ. — только + прил. / de / que"},"exercises":[{"b":"GBE","ex":"1","sec":"A","ins":"El detective Rodrigo Trigo llega a la escena de un robo y ve muchas cosas sospechosas. Va a buscar a la policía y, cuando vuelve, las cosas han cambiado. Completa con las formas adecuadas del artículo."},{"b":"GBE","ex":"2","sec":"A","ins":"Completa con las formas adecuadas del artículo."},{"b":"GBE","ex":"3","sec":"B","ins":"Carmen y Lucía tienen que hacer un trabajo para clase. ¿Sabes de qué hablan? Lee las frases y relaciona cada una con la situación correspondiente."},{"b":"GBE","ex":"4","sec":"B","ins":"Fíjate en el contexto y escribe el artículo correspondiente."},{"b":"GBE","ex":"5","sec":"B","ins":"Lee el comienzo de este cuento y señala si son adecuadas las siguientes interpretaciones."},{"b":"GBE","ex":"6","sec":"C","ins":"Tacha la opción incorrecta y relaciona."},{"b":"GBE","ex":"7","sec":"C","ins":"Completa con las const EX = Object.fromEntries(DATA.exercises.map(e => [e.b + ' ' + e.ex, e]));
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const results = store.get('art-results', {});
const st = Object.assign({ book: 'all', cat: 'all', order: 'seq', wrong: false, pos: 0 }, store.get('art-filters', {}));
let pool = [], answered = null, seed = Math.random();

function ruleParts(id) {
  const t = DATA.rules[id] || id;
  const i = t.indexOf(': ');
  return i > 0 ? [t.slice(0, i), t.slice(i + 2)] : ['', t];
}

/* ---------- Trainer ---------- */
function shuffle(arr) {
  const a = arr.slice(); let s = Math.floor(seed * 2 ** 31) || 1;
  for (let i = a.length - 1; i > 0; i--) { s = (s * 48271) % 2147483647; const j = s % (i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function buildPool() {
  let p = DATA.items.filter(it => (st.book === 'all' || it.b === st.book) && (st.cat === 'all' || it.cat === st.cat));
  if (st.wrong) p = p.filter(it => results[it.id] === false);
  pool = st.order === 'mix' ? shuffle(p) : p;
  if (st.pos >= pool.length) st.pos = 0;
}
function renderFilters() {
  const books = [['all', 'Оба'], ...Object.keys(DATA.books).map(b => [b, b])];
  $('#f-book').innerHTML = books.map(([v, l]) => `<button data-v="${v}" aria-pressed="${st.book === v}" title="${esc(DATA.books[v] || 'Оба учебника')}">${l}</button>`).join('');
  const counts = {};
  DATA.items.forEach(it => { if (st.book === 'all' || it.b === st.book) counts[it.cat] = (counts[it.cat] || 0) + 1; });
  const total = Object.values(counts).reduce((a, b) => a + b, 0);
  $('#f-cat').innerHTML = Object.entries(CATS).filter(([k]) => k === 'all' || counts[k])
    .map(([k, l]) => `<option value="${k}" ${st.cat === k ? 'selected' : ''}>${l} (${k === 'all' ? total : counts[k]})</option>`).join('');
  $('#f-order').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === st.order));
  $('#f-wrong').checked = st.wrong;
}
function save() { store.set('art-filters', st); store.set('art-results', results); }

function renderCard() {
  const card = $('#card');
  const done = pool.filter(it => it.id in results);
  const right = done.filter(it => results[it.id]).length;
  $('#p-pos').textContent = pool.length ? `Задание ${st.pos + 1} из ${pool.length}` : 'Заданий нет';
  $('#p-score').textContent = done.length ? `В этой подборке: верно ${right} из ${done.length}` : 'В этой подборке ещё нет ответов';
  $('#p-bar').style.width = pool.length ? `${(done.length / pool.length) * 100}%` : '0';
  if (!pool.length) {
    card.innerHTML = `<div class="empty">${st.wrong ? 'Ошибок в этой подборке нет. Снимите галочку «только ошибки», чтобы решать все задания.' : 'В этой подборке нет заданий.'}</div>`;
    return;
  }
  const it = pool[st.pos];
  const ex = EX[it.b + ' ' + it.ex] || {};
  const slotCls = answered ? (answered.ok ? 'ok' : 'bad') : '';
  const slotTxt = answered ? answered.pick : '___';
  const opts = it.opt || null;
  const pad = (opts ? [opts] : PAD).map(g => `<div class="grp">${g.map(v => {
    let cls = '';
    if (answered) { if (v === answered.pick) cls = answered.ok ? 'pick-ok' : 'pick-bad'; else if (it.acc.includes(v)) cls = 'right'; }
    return `<button data-a="${esc(v)}" class="${cls}" ${answered ? 'disabled' : ''}>${esc(v)}</button>`;
  }).join('')}</div>`).join('');

  let explain = '';
  if (answered) {
    const mainIdx = it.path.findIndex(p => !p.startsWith('A.') && !p.startsWith('E.') && p !== 'D.sujeto');
    const chain = it.path.map((p, i) => {
      const [src, txt] = ruleParts(p);
      return `<li class="${i === mainIdx ? 'main' : ''}"><span class="rule">${src ? `<span class="src">${esc(src)}</span>` : ''}${esc(txt)}</span></li>`;
    }).join('');
    explain = `<div class="explain">
      <div class="verdict ${answered.ok ? 'ok' : 'bad'}">${answered.ok ? 'Верно' : `Нет. По ключу: <b>${esc(it.ans)}</b>`}</div>
      <div><div class="note" style="margin-bottom:6px">Как к этому приходит алгоритм v2:</div><ol class="chain">${chain}</ol></div>
      ${it.why ? `<div class="note">Разметка: ${esc(it.why)}</div>` : ''}
      ${it.alt ? `<div class="flag">Спорное место: если понять ситуацию иначе («${esc(it.alt)}»), схема даёт другой артикль. Правила обоих учебников этот случай однозначно не решают.</div>` : ''}
      ${it.jud ? `<div class="flag">Здесь решение при разметке принимал составитель: ${esc(it.jud)}</div>` : ''}
      <div class="actions"><button class="btn" id="next">Дальше</button><span class="kbd">Enter</span></div>
    </div>`;
  }
  card.innerHTML = `
    <div class="meta"><code>${esc(it.id)}</code><span>${esc(DATA.books[it.b])}, упр. ${esc(it.ex)}</span>${ex.ins ? `<span class="instr">${esc(ex.ins)}</span>` : ''}</div>
    ${it.ctx ? `<div class="ctx">${esc(it.ctx)}</div>` : ''}
    <div class="sentence">${esc(it.pre)}<span class="slot ${slotCls}">${esc(slotTxt)}</span>${esc(it.post)}</div>
    <div class="pad" role="group" aria-label="Варианты">${pad}</div>
    ${explain}`;
  if (answered) $('#next')?.focus();
}
function answer(v) {
  const it = pool[st.pos];
  const ok = it.acc.includes(v);
  answered = { pick: v, ok };
  results[it.id] = ok;
  save();
  renderCard();
}
function next() {
  answered = null;
  if (st.wrong) { buildPool(); } else { st.pos = (st.pos + 1) % pool.length; }
  save(); renderCard();
}
function refilter() { answered = null; st.pos = 0; seed = Math.random(); buildPool(); renderFilters(); save(); renderCard(); }

$('#card').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'next') return next();
  if (b.dataset.a && !answered) answer(b.dataset.a);
});
$('#f-book').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { st.book = b.dataset.v; st.cat = 'all'; refilter(); } });
$('#f-cat').addEventListener('change', (e) => { st.cat = e.target.value; refilter(); });
$('#f-order').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { st.order = b.dataset.v; refilter(); } });
$('#f-wrong').addEventListener('change', (e) => { st.wrong = e.target.checked; refilter(); });
document.addEventListener('keydown', (e) => {

    { l: 'jugar a + игра', h: 'jugar al fútbol, a las cartas', res: 'def', rule: 'S.jugar', form: { prep: 'a' } },
    { l: 'hablar / saber / enseñar / estudiar + язык или предмет', h: '¿Usted habla chino? Claudia estudia Filosofía.', res: 'zero', rule: 'S.learn' },
    { l: 'hacer + gimnasia, natación, alpinismo', h: 'Hago gimnasia todas las mañanas.', res: 'zero', rule: 'S.hacer' },
    { l: 'Язык или школьный предмет как тема разговора', h: 'El griego es una lengua muy sonora. Las matemáticas.', res: 'def', rule: 'S.subject' },
    { l: 'policía, ejército, bomberos', h: 'Luis quiere ingresar en la policía.', res: 'def', rule: 'S.institution' },
    { l: 'radio, televisión, periódico, noticias — как средство информации', h: 'Escucho la radio. (но Tengo una radio nueva — это аппарат)', res: 'def', rule: 'S.media' },
    { l: 'mar, campo, playa, cielo, naturaleza', h: 'Vamos al campo. Es muy sano bañarse en el mar.', res: 'def', rule: 'S.nature' },
    { l: 'ir / estar / venir + hospital, cine, teatro, médico, dentista, banco, trabajo, colegio, universidad, iglesia, cárcel, oficina', h: 'Está en el hospital. Mi hermana está en la universidad.', res: 'def', rule: 'S.go-def' },
    { l: 'ir / estar / venir + casa, correos, clase', h: 'Edgar está en casa. Voy a correos.', res: 'zero', rule: 'S.go-zero' },
    { l: 'Нет', next: 'q1' } ] },
  q1: { q: 'Я говорю о конкретном предмете или человеке (или о конкретной группе)?', opts: [
    { l: 'Да', next: 'q2' }, { l: 'Нет', next: 'q3' } ] },
  q2: { q: 'Слушатель может понять, какой именно?', opts: [
    { l: 'Да: другого такого нет — в мире или в этой ситуации', h: 'La madre de Antonio es policía. Enciende la luz, por favor.', res: 'def', rule: 'B.I' },
    { l: 'Да: о нём уже говорили', h: 'Tengo un loro y un perro. El loro se llama Ricky.', res: 'def', rule: 'B.II' },
    { l: 'Нет: таких несколько или говорю впервые', h: 'Necesito alquilar un coche. Un hijo de Andrés es médico.', res: 'indef', rule: 'B.indef' } ] },
  q3: { q: 'Тогда что я имею в виду?', opts: [
    { l: 'Тип, вид, средство, материал', h: 'Voy en bicicleta. Clases de guitarra. Avión de papel.', next: 'eval', set: { z: 'C.tipo' } },
    { l: 'Какое-то количество, неважно сколько', h: 'Compra aceite y huevos. ¿Tienes hermanos? Lola colecciona sellos.', next: 'eval', set: { z: 'C.cantidad' } },
    { l: 'Весь класс, в общем смысле', h: 'El perro es el mejor amigo del hombre. Me encanta el melón.', res: 'def', rule: 'D.clase' },
    { l: 'Любого представителя класса', h: 'Un flexo es una lámpara. Un médico tiene que saber escuchar.', res: 'indef', rule: 'D.cualquiera' } ] },
  eval: { q: 'У слова есть оценочное определение?', hint: 'Оценка — «muy …», «-ísimo», «que me muero». Ответ на «какой вид?» (agua mineral, canciones tristes) оценкой не считается.', opts: [
    { l: 'Да', h: 'Tengo unos sellos muy raros. Aquí hacen un pan buenísimo.', res: 'indef', rule: 'C.eval' },
    { l: 'Нет', h: 'Bebemos agua mineral. Toca canciones tristes.', res: 'zero', rule: null } ] },
};
const KIND = {
  def: ['Определённый артикль', 'el · la · los · las'],
  indef: ['Неопределённый артикль', 'un · una · unos · unas'],
  zero: ['Без артикля', 'Ø'],
  lo: ['Средний род', 'lo'],
  asis: ['Артикль как в названии', 'La Habana, El Salvador, Los Ángeles…'],
};
let trail = [], flags = {};
const form = { g: 'm', n: 'sg', at: false, prep: '', omit: false };

function wizardRender() {
  $('#trail').innerHTML = trail.map((t, i) => `<button data-back="${i}"><span class="n">${i + 1}</span><span>${esc(N[t.node].q)}<br><span class="ans">→ ${esc(t.label)}</span></span></button>`).join('');
  const last = trail[trail.length - 1];
  const step = $('#step');
  if (last && last.res) { renderResult(last); return; }
  const id = last ? last.next : 'start';
  const node = N[id];
  step.innerHTML = `<p class="q">${esc(node.q)}</p>${node.hint ? `<p class="qhint">${esc(node.hint)}</p>` : ''}
    <div class="opts">${node.opts.map((o, i) => `<button data-opt="${i}" data-node="${id}">${esc(o.l)}${o.h ? `<em>${esc(o.h)}</em>` : ''}</button>`).join('')}</div>
    ${trail.length ? '<div class="actions"><button class="btn ghost" id="w-back">Назад</button><button class="btn ghost" id="w-reset">Сначала</button></div>' : ''}`;
}
function computeForm(kind) {
  const fem = form.g === 'f', pl = form.n === 'pl';
  const tonic = fem && !pl && form.at && !form.omit;
  const notes = [];
  let a;
  if (kind === 'def') a = pl ? (fem ? 'las' : 'los') : (fem && !tonic ? 'la' : 'el');
  else { a = pl ? (fem ? 'unas' : 'unos') : (fem && !tonic ? 'una' : (form.omit ? 'uno' : 'un')); }
  if (tonic) notes.push('ж.р. на ударное a-: el / un, но согласование остаётся женским (el agua fría)');
  if (form.omit && a === 'uno') notes.push('без существительного un → uno');
  if (form.omit && kind === 'def') notes.push('без существительного el/la/los/las — только перед прилагательным, de или que');
  if (a === 'el' && form.prep) { a = form.prep === 'a' ? 'al' : 'del'; notes.push(`${form.prep} + el = ${a}`); }
  return { a, notes };
}
function renderResult(last) {
  const kind = last.res;
  const [title, forms] = KIND[kind];
  const rule = last.rule || flags.z;
  const [src, txt] = rule ? ruleParts(rule) : ['', ''];
  let html = `<p class="result-kind">${title}: ${esc(forms)}</p>
    ${rule ? `<div class="rule"><span class="src">${esc(src)}</span>${esc(txt)}</div>` : ''}`;
  if (kind === 'zero' && flags.z === 'C.cantidad') html += `<div class="note">Число: исчисляемое — во множественном (Compra huevos), неисчисляемое — в единственном (Compra aceite).</div>`;
  if (kind === 'asis') html += `<div class="note">С предлогом артикль названия не сливается: a El Cairo, de El Salvador.</div>`;
  if (kind === 'def' || kind === 'indef') {
    const seg = (key, vals) => `<span class="seg">${vals.map(([v, l]) => `<button data-f="${key}" data-v="${v}" aria-pressed="${String(form[key]) === String(v)}">${l}</button>`).join('')}</span>`;
    const r = computeForm(kind);
    html += `<div class="form-grid">
      <div class="form-row"><span>Род</span>${seg('g', [['m', 'мужской'], ['f', 'женский']])}</div>
      <div class="form-row"><span>Число</span>${seg('n', [['sg', 'единственное'], ['pl', 'множественное']])}</div>
      ${form.g === 'f' && form.n === 'sg' && !form.omit ? `<div class="form-row"><span>Начало слова</span>${seg('at', [[false, 'обычное'], [true, 'ударное a- / ha-, артикль вплотную']])}</div>` : ''}
      ${kind === 'def' ? `<div class="form-row"><span>Перед артиклем</span>${seg('prep', [['', 'ничего'], ['a', 'a'], ['de', 'de']])}</div>` : ''}
      <div class="form-row"><span>Существительное</span>${seg('omit', [[false, 'есть'], [true, 'опущено']])}</div>
      <div class="form-out"><b>${esc(r.a)}</b>${r.notes.length ? `<span>${esc(r.notes.join('; '))}</span>` : '<span>форма по роду и числу</span>'}</div>
    </div>`;
  }
  html += `<div class="actions"><button class="btn ghost" id="w-back">Назад</button><button class="btn" id="w-reset">Новое предложение</button></div>`;
  $('#step').innerHTML = html;
}
$('#view-scheme').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.opt !== undefined) {
    const o = N[b.dataset.node].opts[Number(b.dataset.opt)];
    trail.push({ node: b.dataset.node, label: o.l, next: o.next, res: o.res, rule: o.rule });
    if (o.set) Object.assign(flags, o.set);
    if (o.set?.omit) form.omit = true;
    if (o.form) Object.assign(form, o.form);
    return wizardRender();
  }
  if (b.dataset.back !== undefined) { trail = trail.slice(0, Number(b.dataset.back)); rebuildFlags(); return wizardRender(); }
  if (b.id === 'w-back') { trail.pop(); rebuildFlags(); return wizardRender(); }
  if (b.id === 'w-reset') { trail = []; rebuildFlags(); Object.assign(form, { g: 'm', n: 'sg', at: false, prep: '', omit: false }); return wizardRender(); }
  if (b.dataset.f) {
    const v = b.dataset.v; form[b.dataset.f] = v === 'true' ? true : v === 'false' ? false : v;
    return wizardRender();
  }
});
function rebuildFlags() {
  flags = {}; form.omit = false;
  trail.forEach(t => { const o = N[t.node].opts.find(x => x.l === t.label); if (o?.set) Object.assign(flags, o.set); if (o?.set?.omit) form.omit = true; });
}

/* ---------- Tabs ---------- */
function showTab(tab) {
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
  $('#view-trainer').hidden = tab !== 'trainer';
  $('#view-scheme').hidden = tab !== 'scheme';
}
document.querySelector('nav.tabs').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  showTab(b.dataset.tab);
  try { history.replaceState(null, '', '#' + b.dataset.tab); } catch { location.hash = b.dataset.tab; }
});
window.addEventListener('hashchange', () => showTab(location.hash === '#scheme' ? 'scheme' : 'trainer'));

const byBook = Object.keys(DATA.books).map(b => `${b} — ${DATA.books[b]}: ${DATA.items.filter(i => i.b === b).length}`).join(' · ');
$('#foot').textContent = `Задания и ответы — из упражнений и ключей учебников (${byBook} пропусков). Ваши ответы хранятся только в этом браузере.`;

buildPool(); renderFilters(); renderCard(); wizardRender();
showTab(location.hash === '#scheme' ? 'scheme' : 'trainer');
</script>
